[workspace]
resolver = "3"
members = [
    "crates/burgess-core",
    "crates/burgess-api",
    "crates/burgess-client",
    "crates/burgess-writer",
    "crates/burgess-reader",
    "crates/burgess-cli",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
burgess-core = { path = "crates/burgess-core" }
burgess-api = { path = "crates/burgess-api" }
burgess-client = { path = "crates/burgess-client" }

arrow-array = "60"
async-trait = "0.1"
futures = "0.3"
object_store = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow-schema = "60"
arrow-select = "60"
bytes = "1"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
prost = "0.14"
rand = "0.10"
thiserror = "2"
tokio = "1"
tracing = "0.1"
unicode-properties = "0.1"

prost-build = "0.14"
protox = "0.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
