[package]
name = "burgess-reader"
description = "Burgess query service: answers lookups over the stored Parquet files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
axum = { workspace = true, features = ["http2"] }
burgess-api.workspace = true
burgess-core.workspace = true
burgess-store.workspace = true
bytes.workspace = true
data-encoding.workspace = true
figment.workspace = true
futures.workspace = true
humantime-serde.workspace = true
jiff.workspace = true
object_store.workspace = true
parquet = { workspace = true, features = ["async"] }
prost.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { workspace = true, features = ["codegen"] }
tracing.workspace = true
tracing-subscriber.workspace = true
twox-hash.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
async-trait.workspace = true
burgess-writer.workspace = true
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
tonic = { workspace = true, features = ["channel"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
