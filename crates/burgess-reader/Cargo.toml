[package]
name = "burgess-reader"
description = "Burgess query service: answers lookups over the stored Parquet files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
arrow-array.workspace = true
axum.workspace = true
burgess-api.workspace = true
burgess-core.workspace = true
burgess-store.workspace = true
bytes.workspace = true
figment.workspace = true
futures.workspace = true
humantime-serde.workspace = true
jiff.workspace = true
object_store.workspace = true
parquet = { workspace = true, features = ["async"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
arrow-schema.workspace = true
async-trait.workspace = true
burgess-writer.workspace = true
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
