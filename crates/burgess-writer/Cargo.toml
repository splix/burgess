[package]
name = "burgess-writer"
description = "Moves Burgess state records from Kafka into Parquet files on object storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Exposes the in-memory log to other crates' tests. It is always available to
# this crate's own tests.
test-util = []

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
burgess-core.workspace = true
bytes.workspace = true
futures.workspace = true
jiff.workspace = true
object_store.workspace = true
parquet.workspace = true
rdkafka.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
arrow-select.workspace = true
async-trait.workspace = true
testcontainers-modules.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
