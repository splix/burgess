[package]
name = "burgess-writer"
description = "Moves Burgess state records from Kafka into Parquet files on object storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Exposes the in-memory log to other crates' tests. It is always available to
# this crate's own tests.
test-util = []

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
burgess-core.workspace = true
bytes.workspace = true
figment.workspace = true
futures.workspace = true
humantime-serde.workspace = true
jiff.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
parquet.workspace = true
rdkafka.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
arrow-select.workspace = true
# Jail isolates the environment variables each config test sets.
figment = { workspace = true, features = ["test"] }
async-trait.workspace = true
testcontainers-modules.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
