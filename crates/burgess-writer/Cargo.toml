[package]
name = "burgess-writer"
description = "Moves Burgess state records from Kafka into Parquet files on object storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Exposes the in-memory log to other crates' tests. It is always available to
# this crate's own tests.
test-util = []

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
