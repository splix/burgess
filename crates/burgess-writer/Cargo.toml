[package]
name = "burgess-writer"
description = "Moves Burgess state records from Kafka into Parquet files on object storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Exposes the in-memory log to other crates' tests. It is always available to
# this crate's own tests.
test-util = []

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
burgess-core.workspace = true
parquet.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
jiff.workspace = true
arrow-select.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
